name: e2e
on:
  workflow_dispatch:
    inputs:
      secs: {default: "45"}
      base: {default: "https://connect.8020musicschool.com:8443"}
      guest_base: {default: ""}
      strict: {default: "1"}
      admit_delay: {default: "0"}
      host_scale: {default: "0.5"}  # Host und Gast teilen sich einen Runner; 4K-Host (1) blockiert sonst den Gast (28.11.)
permissions: {contents: read}
jobs:
  guest:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        n: [1, 2]
        lane:
          - {os: macos-15, guest: chrome}
          - {os: macos-15, guest: safari}
          - {os: macos-15, guest: firefox}
          - {os: macos-15, guest: webkit}
          - {os: windows-2025, guest: chrome}
          - {os: windows-2025, guest: edge}
          - {os: windows-2025, guest: firefox}
    runs-on: ${{ matrix.lane.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: npm init -y >/dev/null && npm i playwright@1.65.1 selenium-webdriver@4 >/dev/null && npx playwright install ${{ matrix.lane.guest == 'firefox' && 'firefox' || matrix.lane.guest == 'webkit' && 'webkit' || '' }} >/dev/null 2>&1 || true
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          choco install vb-cable -y --no-progress | Select-Object -Last 3
          Start-Sleep 5
          Get-CimInstance Win32_SoundDevice | ForEach-Object { "SOUNDKARTE: $($_.Name) $($_.Status)" }
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | ForEach-Object { "ENDPUNKT: $($_.FriendlyName) $($_.Status)" }
      - if: matrix.lane.guest == 'safari'
        run: sudo safaridriver --enable && safaridriver --version && defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      - shell: bash
        env: {ROOM_KEY: "${{ secrets.ROOM_KEY }}", GUEST: "${{ matrix.lane.guest }}", SECS: "${{ inputs.secs }}", BASE: "${{ inputs.base }}", GUEST_BASE: "${{ inputs.guest_base }}", STRICT: "${{ inputs.strict }}", ADMIT_DELAY: "${{ inputs.admit_delay }}", HOST_SCALE: "${{ inputs.host_scale }}"}
        run: test -n "$ROOM_KEY" && node e2e.mjs "qa-e2e-$ROOM_KEY-${{ github.run_id }}-${{ strategy.job-index }}-${{ matrix.n }}-${{ github.run_attempt }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "shots-${{ matrix.lane.os }}-${{ matrix.lane.guest }}-${{ matrix.n }}-${{ github.run_attempt }}", path: out/, if-no-files-found: ignore}
