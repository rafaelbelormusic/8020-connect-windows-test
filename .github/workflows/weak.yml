name: weak-net
on:
  workflow_dispatch:
    inputs:
      profiles: {default: '["schwach","engpass","fern","abrisse"]'}
      minutes: {default: '60'}
      mode: {default: 'speech'}
permissions: {contents: read}
jobs:
  call:
    strategy: {fail-fast: false, matrix: {profile: "${{ fromJSON(inputs.profiles) }}"}}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; sudo modprobe sch_netem || sudo apt-get install -y -qq linux-modules-extra-$(uname -r) >/dev/null; sudo modprobe sch_netem; sudo tc qdisc show dev lo
      - env: {ROOM_KEY: "${{ secrets.ROOM_KEY }}", MODE: "${{ inputs.mode }}"}
        run: test -n "$ROOM_KEY" && CHROME=$(which google-chrome) node weak.mjs "${{ matrix.profile }}" "qa-net-$ROOM_KEY-${{ github.run_id }}-${{ matrix.profile }}" "${{ inputs.minutes }}"
